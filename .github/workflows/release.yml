name: Release

# 打包与发版统一由 install.yml 负责：
#   推送 v* tag → install 各平台打包 → changelog 生成更新日志 → release 创建 Release 并挂 zip
# 这个文件以前也会在 tag 时触发，但仓库里并没有现成的 *.zip，会重复触发并报错。
# 需要手动补发时，直接 workflow_dispatch 触发 install.yml 即可。

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to do here
        run: echo "打包/发版请使用 install.yml（push v* tag 会自动执行）"